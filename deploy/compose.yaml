# Blotter Sync with Docker Compose. See README.md in this folder.
#
#   docker compose up -d                        # LAN only
#   docker compose --profile caddy up -d        # + a public domain over HTTPS
#   docker compose --profile tailscale up -d    # + your tailnet over HTTPS
#
# Profiles combine. Settings come from .env (copy .env.example).

name: blotter-sync

services:
  blotter-sync:
    image: ghcr.io/lasr-0/blotter-sync:${BLOTTER_SYNC_TAG:-1}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "${BLOTTER_SYNC_PORT:-7458}:7458"
    environment:
      BLOTTER_SYNC_KEEP_BACKUPS: ${BLOTTER_SYNC_KEEP_BACKUPS:-20}
      BLOTTER_SYNC_LOG: ${BLOTTER_SYNC_LOG:-info}
    volumes:
      - data:/data

  # Automatic HTTPS for a domain pointing at this host (ports 80 and 443).
  caddy:
    image: caddy:2
    profiles: [caddy]
    restart: unless-stopped
    depends_on: [blotter-sync]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      BLOTTER_DOMAIN: ${BLOTTER_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # Joins your tailnet as its own machine and serves Blotter Sync at
  # https://<TS_HOSTNAME>.<tailnet>.ts.net through Tailscale Serve.
  tailscale:
    image: tailscale/tailscale:stable
    profiles: [tailscale]
    restart: unless-stopped
    depends_on: [blotter-sync]
    hostname: ${TS_HOSTNAME:-blotter}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ./tailscale/serve.json:/config/serve.json:ro
      - tailscale-state:/var/lib/tailscale

volumes:
  data:
  caddy-data:
  caddy-config:
  tailscale-state:
