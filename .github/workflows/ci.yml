name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # blotter-core comes from the Blotter release pinned in Cargo.toml,
      # never a local checkout.
      - name: cargo fmt
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --locked

  # The image is built and run here because development is native on
  # Windows: non-root, read-only root filesystem, data on a volume.
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build -t blotter-sync .

      - name: Runs as non-root
        run: |
          user=$(docker image inspect -f '{{.Config.User}}' blotter-sync)
          echo "image user: $user"
          [ "$user" = nonroot ] || [ "$user" = 65532 ]

      - name: Start (read-only root filesystem, data on a volume)
        run: |
          docker run -d --name blotter-sync -p 7458:7458 \
            -v blotter-sync:/data --read-only blotter-sync
          for i in $(seq 30); do
            curl -fsS http://localhost:7458/v1/hello > hello.json && break
            sleep 1
          done
          cat hello.json
          jq -e '.name and .server_id and (.pairing_open == false)' hello.json
          [ "$(docker top blotter-sync -o user | tail -n +2 | sort -u)" != root ]

      - name: Admin CLI through docker exec
        run: |
          docker exec blotter-sync blotter-sync pair
          curl -fsS http://localhost:7458/v1/hello | jq -e '.pairing_open == true'
          docker exec blotter-sync blotter-sync snapshot --note ci
          docker exec blotter-sync blotter-sync snapshots
          curl -fsS http://localhost:7458/ | grep -q '<html'

      - name: State survives a new container
        run: |
          docker rm -f blotter-sync
          docker run -d --name blotter-sync -p 7458:7458 \
            -v blotter-sync:/data --read-only blotter-sync
          for i in $(seq 30); do
            curl -fsS http://localhost:7458/v1/hello > again.json && break
            sleep 1
          done
          [ "$(jq -r .server_id hello.json)" = "$(jq -r .server_id again.json)" ]

      - name: Logs
        if: always()
        run: docker logs blotter-sync || true
